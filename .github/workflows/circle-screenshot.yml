name: Electron Circle Screenshot

on:
  push:
  pull_request:

jobs:
  render-circle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libflac12
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libFLAC.so.12 /usr/lib/x86_64-linux-gnu/libFLAC.so.8
          sudo apt-get install -y libutf8proc3
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libutf8proc.so.3 /usr/lib/x86_64-linux-gnu/libutf8proc.so.2
          sudo apt-get install -y libportaudio2 libportmidi0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          sudo apt-get install -y libpugixml1v5t64 || sudo apt-get install -y libpugixml1v5
          sudo apt-get install -y \
            libsdl2-2.0-0 libsdl2-ttf-2.0-0 libfontconfig1 libpulse0 \
            libxinerama1 libxi6 libxrandr2 \
            libgl1 libglu1-mesa qtbase5-dev libqt5svg5 zstd \
            xvfb

      - name: Unpack prebuilt MAME (Ubuntu amd64)
        run: |
          dpkg-deb -x prebuilt/mame/linux/0.242/mame-data_0.242+dfsg.1-1_all.deb mame-dist
          dpkg-deb -x prebuilt/mame/linux/0.242/mame_0.242+dfsg.1-1_amd64.deb mame-dist
          cp mame-dist/usr/games/mame ./mame64
          cp -R mame-dist/usr/share/games/mame ./mame-data
          chmod +x mame64

      - name: Stage Electron ROMs
        run: |
          mkdir -p roms
          cp electron.zip roms/electron.zip

      - name: Build UEF tape from BASIC source
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          def crc(data: bytes) -> int:
              """Calculate CRC-16 XMODEM checksum"""
              poly = 0x1021
              reg = 0x0000  # Should initialize to 0x0000, not 0xFFFF
              for b in data:
                  reg ^= b << 8
                  for _ in range(8):
                      if reg & 0x8000:
                          reg = ((reg << 1) & 0xFFFF) ^ poly
                      else:
                          reg = (reg << 1) & 0xFFFF
              return reg

          class DataBlock:
              def __init__(self, name: bytes, load: int, exec_addr: int, block_nr: int, is_last: bool, data: bytes):
                  self.name = name
                  self.load = load
                  self.exec_addr = exec_addr
                  self.block_nr = block_nr
                  self.is_last = is_last
                  self.data = data

              def pack(self) -> bytes:
                  # Block flag: bit 7 set if last block, bit 6 set if empty
                  block_flag = 0x80 if self.is_last else 0x00
                  if len(self.data) == 0:
                      block_flag |= 0x40
                  
                  # Header structure per BBC/Electron spec:
                  # - File name (1-10 chars)
                  # - NULL terminator (0x00)
                  # - Load address (4 bytes, little-endian)
                  # - Exec address (4 bytes, little-endian)
                  # - Block number (2 bytes, little-endian)
                  # - Block length (2 bytes, little-endian)
                  # - Block flag (1 byte)
                  # - Next file address (4 bytes, little-endian, set to 0 for cassette)
                  header = (
                      self.name +
                      b"\x00" +  # NULL terminator
                      struct.pack("<I", self.load) +      # Load address
                      struct.pack("<I", self.exec_addr) + # Exec address
                      struct.pack("<H", self.block_nr) +  # Block number
                      struct.pack("<H", len(self.data)) + # Block length
                      struct.pack("B", block_flag) +      # Block flag
                      struct.pack("<I", 0)                # Next file address (0 for cassette)
                  )
                  
                  header_crc = crc(header)
                  
                  # Sync byte + header + CRC (big-endian)
                  result = b"*" + header + struct.pack(">H", header_crc)
                  
                  # Add data and data CRC if data exists
                  if len(self.data) > 0:
                      data_crc = crc(self.data)
                      result += self.data + struct.pack(">H", data_crc)
                  
                  return result

          def write_uef(chunks, path: str):
              """Write UEF file with proper header and chunks"""
              with open(path, "wb") as f:
                  # UEF header: "UEF File!" + version (minor, major)
                  f.write(b"UEF File!\x00")
                  # Version 0.10 (minor=10, major=0)
                  f.write(struct.pack("<BB", 10, 0))
                  
                  for kind, payload in chunks:
                      if kind == "carrier":
                          # Chunk 0x0110: carrier tone (cycle count in 2 bytes)
                          f.write(struct.pack("<HI", 0x0110, 2))
                          f.write(struct.pack("<H", payload))
                      elif kind == "data":
                          # Chunk 0x0100: implicit start/stop bit data
                          f.write(struct.pack("<HI", 0x0100, len(payload)))
                          f.write(payload)
                      elif kind == "silence":
                          # Chunk 0x0116: floating point gap (in seconds)
                          f.write(struct.pack("<HI", 0x0116, 4))
                          f.write(struct.pack("<f", payload))
                      else:
                          raise ValueError(f"Unknown chunk kind: {kind}")

          src = Path("circle.bas").read_text().replace("\r", "").rstrip()
          payload = (src + "\nRUN\n").replace("\n", "\r").encode("ascii")

          # For BASIC programs, use 0xFFFFFFFF for both load and exec addresses
          blocks = [
              ("carrier", 1500),
              ("data", DataBlock(b"CIRCLE", 0xFFFFFFFF, 0xFFFFFFFF, 0, True, payload).pack()),
              ("carrier", 1500),
          ]

          write_uef(blocks, "circle.uef")
          PY
          test -f circle.uef

      - name: Create autoboot script
        run: |
          cat > circle.lua <<'EOF'
          emu.keypost("*TAPE\nCHAIN \"\"\n")
          local frames = 0
          emu.register_frame_done(function()
            frames = frames + 1
            if frames == 4000 then
              manager.machine.video:snapshot()
            end
          end)
          EOF

      - name: Run emulator and capture screenshot
        run: |
          mkdir -p artifacts
          xvfb-run -a env SDL_AUDIODRIVER=dummy AUDIODEV=null ./mame64 electron -window -skip_gameinfo -sound none \
            -video soft \
            -autoboot_delay 1 \
            -autoboot_script circle.lua \
            -seconds_to_run 15 \
            -snapsize 1280x1024 \
            -snapname circle \
            -snapshot_directory artifacts \
            -cassette circle.uef \
            -rompath roms \
            -hashpath mame-data/hash || true
          test -f artifacts/circle.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: electron-circle
          path: artifacts/circle.png
          compression-level: 0