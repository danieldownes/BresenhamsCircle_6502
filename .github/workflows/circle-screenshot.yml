name: Electron Circle Screenshot

on:
  push:
  pull_request:

jobs:
  render-circle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libflac12
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libFLAC.so.12 /usr/lib/x86_64-linux-gnu/libFLAC.so.8
          sudo apt-get install -y libutf8proc3
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libutf8proc.so.3 /usr/lib/x86_64-linux-gnu/libutf8proc.so.2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          sudo apt-get install -y libpugixml1v5t64 || sudo apt-get install -y libpugixml1v5
          sudo apt-get install -y \
            libsdl2-2.0-0 libsdl2-ttf-2.0-0 libfontconfig1 libpulse0 \
            libxinerama1 libxi6 libxrandr2 \
            libgl1 libglu1-mesa qtbase5-dev libqt5svg5 zstd \
            xvfb

      - name: Unpack prebuilt MAME (Ubuntu amd64)
        run: |
          dpkg-deb -x prebuilt/mame/linux/0.242/mame-data_0.242+dfsg.1-1_all.deb mame-dist
          dpkg-deb -x prebuilt/mame/linux/0.242/mame_0.242+dfsg.1-1_amd64.deb mame-dist
          cp mame-dist/usr/games/mame ./mame64
          cp -R mame-dist/usr/share/games/mame ./mame-data
          chmod +x mame64

      - name: Stage Electron ROMs
        run: |
          mkdir -p roms
          cp electron.zip roms/electron.zip

      - name: Create autoboot script
        run: |
          cat > circle.lua <<'EOF'
          emu.keypost([[
          10 GOTO 240
          20 DEF PROCcirc(xc,yc,x,y)
          30 PLOT69,xc+x,yc+y
          40 PLOT69,xc-x,yc+y
          50 PLOT69,xc+x,yc-y
          60 PLOT69,xc-x,yc-y
          70 PLOT69,xc+y,yc+x
          80 PLOT69,xc-y,yc+x
          90 PLOT69,xc+y,yc-x
          100 PLOT69,xc-y,yc-x
          110 ENDPROC
          120 DEF PROCBres(xc,yc,r,s)
          130 LOCAL x,y,d
          140 x=0
          150 y=r
          160 d=3-2*r
          170 PROCcirc(xc,yc,x,y)
          180 REPEAT
          190 x=x+s
          200 IF d>=0 THEN y=y-s:d=d+4*(x-y)+10 ELSE d=d+4*x+6
          210 PROCcirc(xc,yc,x,y)
          220 UNTIL y <= x
          230 ENDPROC
          240 MODE1
          250 TIME=0
          260 PROCBres(640,512,510,4)
          270 PRINT TIME
          RUN
          ]])
          local frames = 0
          emu.register_frame_done(function()
            frames = frames + 1
            if frames == 360 then
              manager.machine.video:snapshot()
            end
          end)
          EOF

      - name: Run emulator and capture screenshot
        run: |
          mkdir -p artifacts
          xvfb-run -a ./mame64 electron -window -skip_gameinfo \
            -video soft \
            -autoboot_delay 1 \
            -autoboot_script circle.lua \
            -seconds_to_run 10 \
            -snapsize 1280x1024 \
            -snapname circle \
            -snapshot_directory artifacts \
            -rompath roms \
            -hashpath mame-data/hash

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: electron-circle
          path: artifacts/
